<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智盛杯训练题（500题）在线答题</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f0f2f5; color: #333; }
.hidden { display: none !important; }
.screen { max-width: 860px; margin: 0 auto; padding: 16px; }
button { cursor: pointer; font-family: inherit; }

/* 开始页 */
#start { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.startcard { background: #fff; border-radius: 16px; padding: 40px 32px; box-shadow: 0 4px 20px rgba(0,0,0,.08); width: 100%; max-width: 560px; }
.startcard h1 { font-size: 26px; margin-bottom: 8px; color: #1a3c6e; }
.startcard .sub { color: #888; font-size: 14px; margin-bottom: 20px; }
.rules { text-align: left; background: #f7f9fc; border-radius: 10px; padding: 16px 20px; font-size: 14px; line-height: 1.9; margin-bottom: 20px; color: #555; }
.rules b { color: #1a3c6e; }
#nameInput { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid #d9d9d9; border-radius: 8px; margin-bottom: 16px; outline: none; }
#nameInput:focus { border-color: #1a3c6e; }
#startBtn { width: 100%; padding: 13px; font-size: 17px; background: #1a3c6e; color: #fff; border: none; border-radius: 8px; }
#startBtn:hover { background: #244d8f; }

/* 答题页 */
.topbar { position: sticky; top: 0; z-index: 10; background: #1a3c6e; color: #fff; border-radius: 0 0 10px 10px; padding: 10px 14px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; }
.tab { padding: 6px 14px; border-radius: 16px; font-size: 14px; background: rgba(255,255,255,.15); color: #fff; border: none; white-space: nowrap; }
.tab.active { background: #fff; color: #1a3c6e; font-weight: bold; }
.info { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 13px; }
#counter, #timer { background: rgba(255,255,255,.15); padding: 3px 10px; border-radius: 12px; }
#submitBtn { background: #e05a47; color: #fff; border: none; padding: 5px 16px; border-radius: 14px; font-size: 14px; }
.qcard { background: #fff; border-radius: 12px; padding: 22px 20px; margin-top: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
.qhead { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.qno { font-weight: bold; font-size: 17px; color: #1a3c6e; }
.badge { font-size: 12px; padding: 2px 10px; border-radius: 10px; }
.badge.single { background: #e6f0ff; color: #2b66b9; }
.badge.multi { background: #fff3e0; color: #c77700; }
.badge.judge { background: #e8f8ef; color: #1e8e4d; }
.stem { font-size: 16px; line-height: 1.8; margin-bottom: 16px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border: 1.5px solid #e3e6eb; border-radius: 10px; margin-bottom: 9px; font-size: 15px; line-height: 1.6; transition: all .15s; }
.opt:hover { border-color: #9db4d8; background: #f8fafd; }
.opt .lt { font-weight: bold; color: #1a3c6e; min-width: 18px; }
.opt.selected { border-color: #1a3c6e; background: #eef4fc; }
.opt.selected .lt { color: #1a3c6e; }
.judgewrap { display: flex; gap: 12px; }
.judgebtn { flex: 1; padding: 14px; font-size: 16px; border-radius: 10px; border: 1.5px solid #e3e6eb; background: #fff; }
.judgebtn.selected { border-color: #1a3c6e; background: #eef4fc; font-weight: bold; }
.navbtns { display: flex; gap: 12px; margin-top: 14px; }
.navbtns button { flex: 1; padding: 11px; font-size: 15px; border-radius: 8px; border: 1px solid #d9d9d9; background: #fff; }
.navbtns button:hover { border-color: #1a3c6e; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin-top: 16px; }
.qcell { padding: 7px 0; text-align: center; font-size: 13px; border-radius: 6px; border: 1px solid #e3e6eb; background: #fff; }
.qcell.answered { background: #dff0e2; border-color: #8fc99d; color: #1e8e4d; }
.qcell.current { background: #1a3c6e; color: #fff; border-color: #1a3c6e; }
.qcell.wrong { background: #fde4e0; border-color: #e9a79d; color: #c0392b; }

/* 结果页 */
.resultcard { background: #fff; border-radius: 16px; padding: 28px 24px; box-shadow: 0 4px 20px rgba(0,0,0,.08); margin-top: 14px; text-align: center; }
.resultcard h2 { color: #1a3c6e; margin-bottom: 6px; }
.bigscore { font-size: 52px; font-weight: bold; color: #1a3c6e; }
.bigscore small { font-size: 18px; color: #888; }
.statrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
.stat { background: #f7f9fc; border-radius: 10px; padding: 10px 18px; font-size: 14px; }
.stat b { display: block; font-size: 18px; color: #1a3c6e; }
.filters { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
.filters button { padding: 7px 18px; border-radius: 16px; border: 1px solid #d9d9d9; background: #fff; font-size: 14px; }
.filters button.active { background: #1a3c6e; color: #fff; border-color: #1a3c6e; }
.revcard { background: #fff; border-radius: 12px; padding: 18px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
.revstem { font-size: 15px; line-height: 1.7; margin: 8px 0; }
.revopt { padding: 7px 12px; border-radius: 8px; margin-bottom: 5px; font-size: 14px; border: 1px solid transparent; }
.revopt.ok { background: #e8f8ef; border-color: #8fc99d; }
.revopt.bad { background: #fde4e0; border-color: #e9a79d; }
.revans { font-size: 13px; color: #888; margin-top: 8px; }
#redoBtn { display: block; margin: 20px auto; padding: 12px 40px; background: #1a3c6e; color: #fff; border: none; border-radius: 8px; font-size: 16px; }
@media (max-width: 600px) {
  .bigscore { font-size: 40px; }
  .stem { font-size: 15px; }
}
</style>
</head>
<body>

<div id="start" class="screen">
  <div class="startcard">
    <h1>智盛杯训练题</h1>
    <div class="sub">500 题在线答题（单选 350 + 多选 75 + 判断 75）</div>
    <div class="rules">
      <b>考试说明</b><br>
      · 共 5 组，每组 100 题：<b>70 道单选 + 15 道多选 + 15 道判断</b>，三题型混合穿插<br>
      · 每题 1 分，满分 <b>500 分</b>；多选漏选、多选、错选均不得分<br>
      · 多选题选项顺序已全部打乱，凭理解作答<br>
      · 中途退出自动保存进度，重新打开可继续作答<br>
      · 交卷后自动判分，可逐题查看解析
    </div>
    <input id="nameInput" placeholder="请输入姓名 / 学号" maxlength="20">
    <button id="startBtn">开始答题</button>
  </div>
</div>

<div id="exam" class="screen hidden">
  <div class="topbar">
    <div class="tabs" id="tabs"></div>
    <div class="info">
      <span id="counter"></span>
      <span id="timer">用时 00:00</span>
      <button id="submitBtn">交卷</button>
    </div>
  </div>
  <div class="qcard" id="qcard"></div>
  <div class="navbtns">
    <button id="prevBtn">上一题</button>
    <button id="nextBtn">下一题</button>
  </div>
  <div class="qgrid" id="qgrid"></div>
</div>

<div id="result" class="screen hidden">
  <div class="resultcard" id="resultBox"></div>
  <div class="filters" id="filters"></div>
  <div id="review"></div>
  <button id="redoBtn">重新作答</button>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
